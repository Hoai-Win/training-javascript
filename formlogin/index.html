<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card" style="width: 25rem;">
      <div class="card-body">
        <h5 class="card-title text-center">Đăng nhập</h5>
        <form>
          <div class="mb-3">
            <label for="username" class="form-label">Tài khoản</label>
            <input id="username" type="text" class="form-control" id="username" placeholder="Nhập tài khoản" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Mật khẩu</label>
            <input id="password" type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
          </div>
          <button id="submit" type="submit" class="btn btn-primary w-100">Đăng nhập</button>
        </form>
      </div>
    </div>
  </div>

<script src="./main.js"></script>
</body>

</html>
